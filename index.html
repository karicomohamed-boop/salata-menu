<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#477f45"><title>سلطة | SALATA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#477f45;--dark:#315f31;--soft:#eef7e9;--cream:#fbfcf8;--ink:#263525;--muted:#70776d;--line:#e5eae0;--shadow:0 12px 34px rgba(38,53,37,.09)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Cairo,Arial,sans-serif}.top{height:290px;position:relative;background:#fff;overflow:visible}.pattern{position:absolute;inset:0;background-image:radial-gradient(circle at 10% 25%,#dcebd6 0 2px,transparent 3px),radial-gradient(circle at 27% 72%,#e6f0e0 0 3px,transparent 4px),radial-gradient(circle at 73% 28%,#dcebd6 0 2px,transparent 3px),radial-gradient(circle at 90% 70%,#e6f0e0 0 3px,transparent 4px)}.band{position:absolute;left:0;right:0;top:112px;height:118px;background:var(--green)}.logo{position:absolute;z-index:2;top:38px;left:50%;transform:translateX(-50%);width:230px;height:230px;border-radius:50%;object-fit:cover;background:var(--green);border:8px solid #fff;box-shadow:0 14px 40px rgba(37,76,39,.18)}.logoFallback{display:flex;align-items:center;justify-content:center;color:#fff;font-size:58px;font-weight:800;letter-spacing:-4px}.actions{position:absolute;top:24px;left:24px;right:24px;display:flex;justify-content:space-between;z-index:4}.icon,.adminBtn{border:0;border-radius:15px;padding:12px 17px;background:#fff;color:var(--green);font:700 14px Cairo;box-shadow:0 8px 24px rgba(30,65,32,.08);cursor:pointer}.adminBtn{background:#eff7ea}.hero{text-align:center;padding:92px 20px 26px}.hero h1{margin:0;color:var(--green);font-size:32px;font-weight:800}.hero p{margin:3px 0;color:#626960;font-size:18px}.leaf{color:#65a64f;font-size:25px;line-height:1}.cats{max-width:1120px;margin:28px auto 46px;padding:0 18px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.cat{border:1px solid var(--line);background:#fff;border-radius:22px;padding:20px 10px;min-height:138px;box-shadow:var(--shadow);cursor:pointer;transition:.2s;font:inherit}.cat:hover,.cat.active{transform:translateY(-4px);border-color:#c7ddbf}.cat .ico{font-size:35px}.cat b{display:block;margin-top:8px;color:var(--ink);font-size:16px}.cat.active b{color:var(--green)}main{max-width:1120px;margin:auto;padding:0 18px 90px}.sectionTitle{text-align:center;margin-bottom:24px}.sectionTitle h2{margin:0;color:var(--green);font-size:29px}.sectionTitle p{margin:4px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.pic{width:100%;height:220px;display:block;object-fit:cover;background:linear-gradient(135deg,#eef7e9,#f8f3e5)}.body{padding:17px}.tag{display:inline-block;background:var(--soft);color:var(--green);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}.card h3{margin:9px 0 5px;color:var(--green);font-size:20px}.desc{min-height:52px;color:#6c736a;font-size:14px;line-height:1.9}.price{margin-top:14px;padding-top:12px;border-top:1px dashed #d7ddd3;color:var(--green);font-weight:700}.price strong{font-size:23px;margin-right:5px}.empty{text-align:center;padding:48px;border:1px dashed #d3ddce;background:#fff;border-radius:20px;color:var(--muted);grid-column:1/-1}footer{background:var(--green);color:#fff;text-align:center;padding:25px}.drawer,.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:none}.drawer.open,.modal.open{display:block}.drawerPanel{width:min(420px,88vw);height:100%;background:#fff;padding:24px;box-shadow:-20px 0 50px rgba(0,0,0,.14)}.drawerPanel h2{color:var(--green)}.drawerPanel button{width:100%;margin:6px 0}.modal{align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{width:min(480px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 25px 70px rgba(0,0,0,.18)}.box h2{margin-top:0;color:var(--green)}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid #dce4d8;border-radius:12px;padding:12px;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:#9fbe96}.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--green);color:#fff;font:700 14px Cairo;cursor:pointer}.btn.alt{background:var(--soft);color:var(--green)}.admin{display:none;min-height:100vh;background:#f4f7f1}.admin.on{display:block}.bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.bar b{color:var(--green);font-size:18px}.adminMain{max-width:1120px;margin:24px auto;padding:0 18px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:20px;box-shadow:0 8px 25px rgba(38,53,37,.05)}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.adminList{display:grid;gap:10px}.adminItem{display:grid;grid-template-columns:72px 1fr auto;gap:13px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:15px}.thumb{width:72px;height:58px;border-radius:10px;object-fit:cover;background:var(--soft)}.muted{color:var(--muted);font-size:12px}.status{margin-top:10px;font-size:13px;color:var(--green)}.danger{background:#fff0f0;color:#b33;border:1px solid #f0d0d0}.hide{display:none!important}@media(max-width:850px){.cats{grid-template-columns:repeat(5,160px);overflow:auto;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.grid{grid-template-columns:repeat(2,1fr)}.logo{width:195px;height:195px}.top{height:270px}.band{top:102px;height:100px}.hero{padding-top:70px}}@media(max-width:560px){.top{height:250px}.pattern{opacity:.7}.band{top:92px;height:80px}.logo{width:165px;height:165px;top:38px}.hero{padding-top:65px}.hero h1{font-size:27px}.hero p{font-size:16px}.grid{grid-template-columns:1fr}.pic{height:230px}.formGrid{grid-template-columns:1fr}.adminItem{grid-template-columns:55px 1fr}.adminItem .rowBtns{grid-column:1/-1}.thumb{width:55px;height:50px}}
</style></head>
<body>
<div id="customer">
<header class="top"><div class="pattern"></div><div class="band"></div><div id="logoWrap"><img class="logo" src="logo.svg" alt="سلطة" onerror="this.remove();document.getElementById('logoWrap').innerHTML='<div class="logo logoFallback">سلطة</div>'"></div><div class="actions"><button class="icon" onclick="openDrawer()">☰</button><button class="adminBtn" onclick="openLogin()">🔒 دخول أدمن</button></div></header>
<section class="hero"><div class="leaf">⌁</div><h1>مرحباً بك في سلطة</h1><p>خيارات صحية.. لحياة أفضل</p><div class="leaf">⌁</div></section>
<nav id="cats" class="cats"></nav>
<main><div class="sectionTitle"><h2 id="title">الوجبات</h2><p id="subtitle">وجبات صحية ومغذية تناسب أسلوب حياتك</p></div><div id="grid" class="grid"></div></main><footer>سلطة • اختيارات صحية.. لحياة أفضل</footer>
</div>
<div id="drawer" class="drawer" onclick="if(event.target===this)closeDrawer()"><aside class="drawerPanel"><button class="icon" onclick="closeDrawer()">✕</button><h2>أقسام القائمة</h2><div id="drawerCats"></div></aside></div>
<div id="loginModal" class="modal"><div class="box"><h2>دخول الأدمن</h2><p class="muted">استخدم حساب الأدمن الذي أنشأته في Supabase.</p><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"><div style="display:flex;gap:8px;margin-top:18px"><button class="btn" onclick="login()">دخول</button><button class="btn alt" onclick="closeLogin()">رجوع</button></div><div id="loginMsg" class="status"></div></div></div>
<div id="admin" class="admin"><div class="bar"><b>SALATA ADMIN</b><div><button class="btn alt" onclick="showCustomer()">عرض الموقع</button> <button class="btn" onclick="logout()">خروج</button></div></div><div class="adminMain"><div class="panel"><h2 style="color:var(--green);margin-top:0">إضافة صنف جديد</h2><div class="formGrid"><div><label>اسم الصنف</label><input id="aName"></div><div><label>القسم</label><select id="aCategory"></select></div></div><label>الوصف / المكونات</label><textarea id="aDesc" rows="3"></textarea><div class="formGrid"><div><label>السعر بالجنيه</label><input id="aPrice" type="number" step="0.01"></div><div><label>الصورة</label><input id="aImage" type="file" accept="image/*"></div></div><div style="margin-top:16px"><button class="btn" onclick="addItem()">حفظ الصنف</button></div><div id="saveMsg" class="status"></div></div><div class="panel"><h2 style="color:var(--green);margin-top:0">الأصناف الحالية</h2><div id="adminList" class="adminList"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://tmnghnbvgyyunoyrmiev.supabase.co',SB_KEY='sb_publishable_5CVrdlAKW3OF3sq2DCsQ_w_UQB3UBZb',sb=supabase.createClient(SB_URL,SB_KEY);
const cats=[['meals','الوجبات','🥗'],['hot','المشروبات الساخنة','☕'],['drinks','المشروبات والعصائر','🥤'],['snacks','سناكس','🍪'],['extras','الإضافات','＋']];let active='meals',items=[];
const $=id=>document.getElementById(id),label=c=>cats.find(x=>x[0]===c)?.[1]||c;
function placeholder(n){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><rect width="100%" height="100%" fill="#eef7e9"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" fill="#477f45" font-size="38" font-family="Arial">${n}</text></svg>`)}
function renderCats(){const h=cats.map(c=>`<button class="cat ${active===c[0]?'active':''}" onclick="selectCat('${c[0]}')"><div class="ico">${c[2]}</div><b>${c[1]}</b></button>`).join('');$('cats').innerHTML=h;$('drawerCats').innerHTML=cats.map(c=>`<button class="btn alt" onclick="selectCat('${c[0]}');closeDrawer()">${c[2]} ${c[1]}</button>`).join('');$('aCategory').innerHTML=cats.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}
function selectCat(c){active=c;renderCats();renderItems()}
function renderItems(){const list=items.filter(x=>x.category===active);$('title').textContent=label(active);$('subtitle').textContent=active==='extras'?'إضافات بسيطة تكمل اختيارك':'وجبات صحية ومغذية تناسب أسلوب حياتك';$('grid').innerHTML=list.length?list.map(x=>`<article class="card"><img class="pic" src="${x.image_url||placeholder(x.name)}" alt="${x.name}"><div class="body"><span class="tag">${label(x.category)}</span><h3>${x.name}</h3><div class="desc">${x.description||'تفاصيل الصنف والمكونات تظهر هنا.'}</div><div class="price">السعر <strong>${x.price==null?'—':Number(x.price).toLocaleString('ar-EG')+' ج.م'}</strong></div></div></article>`).join(''):`<div class="empty">لا توجد أصناف مضافة في هذا القسم حتى الآن.</div>`}
async function load(){const r=await sb.from('menu_items').select('*').order('id');if(r.error){console.warn(r.error);items=[]}else items=r.data||[];renderCats();renderItems();renderAdmin()}
function renderAdmin(){$('adminList').innerHTML=items.length?items.map(x=>`<div class="adminItem"><img class="thumb" src="${x.image_url||placeholder(x.name)}"><div><b>${x.name}</b><div class="muted">${label(x.category)} • ${x.price??'—'} ج.م</div></div><div class="rowBtns"><button class="btn danger" onclick="deleteItem(${Number(x.id)})">حذف</button></div></div>`).join(''):'<div class="muted">لا توجد أصناف بعد.</div>'}
async function addItem(){const name=$('aName').value.trim();if(!name){$('saveMsg').textContent='اكتب اسم الصنف أولاً.';return}$('saveMsg').textContent='جاري الحفظ...';let image_url=null;const f=$('aImage').files[0];if(f){const path=`${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('menu-images').upload(path,f,{upsert:false});if(up.error){$('saveMsg').textContent='خطأ في رفع الصورة: '+up.error.message;return}image_url=sb.storage.from('menu-images').getPublicUrl(path).data.publicUrl}const r=await sb.from('menu_items').insert({name,category:$('aCategory').value,description:$('aDesc').value.trim(),price:$('aPrice').value?Number($('aPrice').value):null,image_url}).select().single();if(r.error){$('saveMsg').textContent='خطأ في حفظ الصنف: '+r.error.message;return}items.push(r.data);$('aName').value='';$('aDesc').value='';$('aPrice').value='';$('aImage').value='';$('saveMsg').textContent='تم حفظ الصنف بنجاح.';renderItems();renderAdmin()}
async function deleteItem(id){if(!confirm('هل تريد حذف هذا الصنف؟'))return;const r=await sb.from('menu_items').delete().eq('id',id);if(r.error){alert(r.error.message);return}items=items.filter(x=>Number(x.id)!==id);renderItems();renderAdmin()}
async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('loginMsg').textContent='تعذر الدخول: '+r.error.message;return}closeLogin();showAdmin()}
async function logout(){await sb.auth.signOut();showCustomer()}
function openLogin(){$('loginModal').classList.add('open')};function closeLogin(){$('loginModal').classList.remove('open');$('loginMsg').textContent=''}function openDrawer(){$('drawer').classList.add('open')};function closeDrawer(){$('drawer').classList.remove('open')};function showAdmin(){$('customer').classList.add('hide');$('admin').classList.add('on');renderAdmin()};function showCustomer(){$('admin').classList.remove('on');$('customer').classList.remove('hide')}
sb.auth.getSession().then(({data})=>{if(data.session)showAdmin()});load();
</script></body></html>
